name: Build dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile OffsetDumper.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          xcrun clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -dynamiclib -fobjc-arc -std=c++17 -O2 \
            -framework Foundation -framework UIKit \
            -install_name @executable_path/Frameworks/OffsetDumper.dylib \
            Dumper.mm Entry.mm -o build/OffsetDumper.dylib
          codesign -f -s - build/OffsetDumper.dylib
          file build/OffsetDumper.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: OffsetDumper
          path: build/OffsetDumper.dylib
